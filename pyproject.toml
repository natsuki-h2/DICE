[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dice-alma"
version = "0.1.0"
description = "Injection-recovery measurements and population inference for astronomical images and cubes"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Natsuki H. Hayatsu", email = "hayatsu@aoni.waseda.jp"},
]
license = {file = "LICENSE"}
keywords = ["astronomy", "interferometry", "source-extraction", "completeness", "contamination"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
population = ["astropy>=5.3", "matplotlib>=3.7"]
test = ["astropy>=5.3", "pytest>=7"]
all = ["astropy>=5.3", "matplotlib>=3.7", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/natsuki-h2/DICE"
Documentation = "https://github.com/natsuki-h2/DICE#readme"
Issues = "https://github.com/natsuki-h2/DICE/issues"
Source = "https://github.com/natsuki-h2/DICE"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
